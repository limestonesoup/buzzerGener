<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cryptic Buzzer</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f0f1a;
    color: #fff;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }

  /* ---- NAME ENTRY ---- */
  #nameScreen input {
    font-size: 1.4rem;
    padding: 14px 20px;
    border-radius: 12px;
    border: 2px solid #444;
    background: #1a1a2e;
    color: #fff;
    width: 280px;
    text-align: center;
    outline: none;
  }
  #nameScreen input:focus { border-color: #e94560; }
  #nameScreen button, .btn {
    margin-top: 16px;
    font-size: 1.1rem;
    padding: 12px 32px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    transition: transform .1s;
  }
  #nameScreen button:active, .btn:active { transform: scale(.95); }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-green   { background: #00c853; color: #000; }
  .btn-yellow  { background: #ffd600; color: #000; }
  .btn-gray    { background: #333; color: #aaa; }
  .btn-red     { background: #ff1744; color: #fff; }

  /* ---- PLAYER BUZZER ---- */
  #playerScreen { display:none; width:100%; max-width:400px; }
  #playerName { font-size: 1.2rem; color: #888; margin-bottom: 8px; }
  #roundInfo  { font-size: 1rem; color: #666; margin-bottom: 24px; }
  #statusText { font-size: 1.3rem; margin-bottom: 24px; min-height: 40px; }
  #buzzBtn {
    width: 220px; height: 220px;
    border-radius: 50%;
    border: 6px solid #e94560;
    background: radial-gradient(circle at 35% 35%, #ff6b81, #e94560 60%, #b8001f);
    color: #fff;
    font-size: 2rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(233,69,96,.4), inset 0 -6px 12px rgba(0,0,0,.3);
    transition: transform .08s, box-shadow .08s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #buzzBtn:active {
    transform: scale(.92);
    box-shadow: 0 0 15px rgba(233,69,96,.3), inset 0 -2px 6px rgba(0,0,0,.3);
  }
  #buzzBtn.locked {
    background: radial-gradient(circle at 35% 35%, #555, #333 60%, #222);
    border-color: #444;
    box-shadow: none;
    cursor: default;
  }
  #buzzBtn.waiting {
    background: radial-gradient(circle at 35% 35%, #666, #444 60%, #333);
    border-color: #555;
    box-shadow: 0 0 20px rgba(255,255,255,.05);
  }

  /* ---- ADMIN ---- */
  #adminScreen { display:none; width:100%; max-width:700px; }
  #adminScreen h1 { font-size: 1.6rem; margin-bottom: 4px; }
  #adminRound { font-size: 1.1rem; color: #888; margin-bottom: 20px; }
  .admin-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px; }
  #firstBuzzDisplay {
    font-size: 2.5rem;
    font-weight: 900;
    color: #00e676;
    min-height: 60px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(0,230,118,.5);
  }
  #firstBuzzLabel { font-size: .9rem; color: #666; margin-bottom: 24px; }
  .player-list {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-top: 12px;
  }
  .player-chip {
    padding: 8px 16px;
    border-radius: 20px;
    background: #1a1a2e;
    border: 2px solid #333;
    font-size: .95rem;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .player-chip.muted {
    background: #3a1a1a;
    border-color: #e94560;
    text-decoration: line-through;
    color: #888;
  }
  .player-chip.buzzed {
    border-color: #00e676;
    color: #00e676;
  }
  #buzzLog {
    margin-top: 20px;
    font-size: .85rem;
    color: #555;
    max-height: 120px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<!-- ====== SCREEN 1: NAME ENTRY ====== -->
<div id="nameScreen">
  <h1 style="margin-bottom:8px;">🔔 Cryptic Buzzer</h1>
  <p style="color:#888; margin-bottom:24px;">Enter your name to join</p>
  <input type="text" id="nameInput" placeholder="Your name" maxlength="20" autocomplete="off">
  <br>
  <button class="btn btn-primary" onclick="joinAsPlayer()">Join</button>
  <br><br>
  <a href="?admin=1" style="color:#444; font-size:.8rem; text-decoration:none;">Admin? →</a>
</div>

<!-- ====== SCREEN 2: PLAYER BUZZER ====== -->
<div id="playerScreen">
  <div id="playerName"></div>
  <div id="roundInfo"></div>
  <div id="statusText">Waiting for round to start...</div>
  <button id="buzzBtn" class="waiting" onclick="buzz()">BUZZ!</button>
</div>

<!-- ====== SCREEN 3: ADMIN ====== -->
<div id="adminScreen">
  <h1>🎛️ Admin Control</h1>
  <div id="adminRound">Round 1</div>

  <div class="admin-controls">
    <button id="enableBtn" class="btn btn-green" onclick="enableRound()">▶ Enable Round</button>
    <button class="btn btn-yellow" onclick="resetRound()">↻ Reset (New Round)</button>
  </div>

  <div id="firstBuzzDisplay">—</div>
  <div id="firstBuzzLabel">First to buzz</div>

  <h3 style="color:#888; font-size:.95rem;">Players <span style="color:#555;">(tap to mute/unmute)</span></h3>
  <div id="playerList" class="player-list"></div>

  <div id="buzzLog"></div>
</div>

<script>
// ============================================================
//  🔥 FIREBASE CONFIG (yours, already filled in)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyD1JnNTTmnp9RDJsYzClByJkmW1ytVWkC4",
  authDomain: "crypticintro.firebaseapp.com",
  databaseURL: "https://crypticintro-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "crypticintro",
  storageBucket: "crypticintro.firebasestorage.app",
  messagingSenderId: "555710194845",
  appId: "1:555710194845:web:0a0377f2408c8c347b2074",
  measurementId: "G-WNBWDQDGDC"
};

// ============================================================
//  INIT
// ============================================================
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const isAdmin = new URLSearchParams(location.search).get('admin') === '1';
let myName = '';
let hasBuzzedThisRound = false;
let currentRound = 0;

// ============================================================
//  ADMIN MODE
// ============================================================
if (isAdmin) {
  document.getElementById('nameScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  initAdmin();
}

function initAdmin() {
  db.ref('state').on('value', snap => {
    const s = snap.val() || {};
    const round = s.round || 1;
    const enabled = s.enabled || false;
    const firstBuzz = s.firstBuzz || null;

    document.getElementById('adminRound').textContent = `Round ${round}`;
    document.getElementById('firstBuzzDisplay').textContent = firstBuzz || '—';
    document.getElementById('firstBuzzLabel').textContent = firstBuzz ? '🏆 First to buzz!' : 'First to buzz';

    const btn = document.getElementById('enableBtn');
    if (enabled) {
      btn.textContent = '⏸ Round Active';
      btn.className = 'btn btn-gray';
    } else {
      btn.textContent = '▶ Enable Round';
      btn.className = 'btn btn-green';
    }
  });

  db.ref('players').on('value', snap => {
    const players = snap.val() || {};
    renderPlayerChips(Object.keys(players));
  });

  db.ref('muted').on('value', snap => {
    window._muted = snap.val() || {};
    document.querySelectorAll('.player-chip').forEach(chip => {
      const name = chip.dataset.name;
      chip.classList.toggle('muted', !!window._muted[name]);
    });
  });

  db.ref('buzzes').on('value', snap => {
    const buzzes = snap.val() || {};
    const list = Object.values(buzzes).sort((a, b) => a.time - b.time);
    const logEl = document.getElementById('buzzLog');
    if (list.length === 0) {
      logEl.innerHTML = '';
      document.querySelectorAll('.player-chip').forEach(chip => chip.classList.remove('buzzed'));
      return;
    }
    logEl.innerHTML = '<strong style="color:#888;">Buzz order:</strong> ' +
      list.map((b, i) => `<span style="color:${i === 0 ? '#00e676' : '#666'}">${i + 1}. ${b.name}</span>`).join(' &nbsp;·&nbsp; ');

    const buzzedNames = new Set(list.map(b => b.name));
    document.querySelectorAll('.player-chip').forEach(chip => {
      chip.classList.toggle('buzzed', buzzedNames.has(chip.dataset.name));
    });
  });
}

function renderPlayerChips(names) {
  const container = document.getElementById('playerList');
  container.innerHTML = '';
  names.sort().forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'player-chip';
    chip.dataset.name = name;
    chip.textContent = name;
    if (window._muted && window._muted[name]) chip.classList.add('muted');
    chip.onclick = () => toggleMute(name);
    container.appendChild(chip);
  });
}

function toggleMute(name) {
  const ref = db.ref('muted/' + name);
  ref.once('value', snap => {
    if (snap.val()) ref.remove();
    else ref.set(true);
  });
}

function enableRound() {
  db.ref('state/enabled').set(true);
}

function resetRound() {
  db.ref('state').once('value', snap => {
    const s = snap.val() || {};
    const newRound = (s.round || 1) + 1;
    db.ref('state').set({ round: newRound, enabled: false, firstBuzz: null });
    db.ref('buzzes').remove();
    db.ref('muted').remove();
  });
}

// ============================================================
//  PLAYER MODE
// ============================================================
function joinAsPlayer() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  myName = name;

  db.ref('players/' + myName).set(true);

  document.getElementById('nameScreen').style.display = 'none';
  document.getElementById('playerScreen').style.display = 'block';
  document.getElementById('playerName').textContent = `Playing as: ${myName}`;

  db.ref('state').on('value', snap => {
    const s = snap.val() || {};
    const round = s.round || 1;
    const enabled = s.enabled || false;
    const firstBuzz = s.firstBuzz || null;

    // Reset buzz flag when round changes
    if (round !== currentRound) {
      currentRound = round;
      hasBuzzedThisRound = false;
    }

    document.getElementById('roundInfo').textContent = `Round ${round}`;
    const btn = document.getElementById('buzzBtn');
    const status = document.getElementById('statusText');

    if (firstBuzz === myName) {
      status.innerHTML = '🎉 <span style="color:#ffd600">YOU got it!</span>';
      btn.className = 'locked';
      btn.textContent = '✓';
    } else if (firstBuzz) {
      status.innerHTML = `<span style="color:#888">${firstBuzz} got it first</span>`;
      btn.className = 'locked';
      btn.textContent = '✗';
    } else if (enabled) {
      if (hasBuzzedThisRound) {
        status.textContent = 'Buzzed! Waiting...';
        btn.className = 'locked';
        btn.textContent = '⏳';
      } else if (window._iAmMuted) {
        status.innerHTML = '🔇 <span style="color:#e94560">You are muted this round</span>';
        btn.className = 'locked';
        btn.textContent = '🔇';
      } else {
        status.innerHTML = '<span style="color:#00e676">🟢 GO GO GO!</span>';
        btn.className = '';
        btn.textContent = 'BUZZ!';
      }
    } else {
      status.textContent = 'Waiting for round to start...';
      btn.className = 'waiting';
      btn.textContent = 'BUZZ!';
    }
  });

  db.ref('muted/' + myName).on('value', snap => {
    window._iAmMuted = !!snap.val();
  });
}

function buzz() {
  if (hasBuzzedThisRound) return;

  db.ref('state').once('value', snap => {
    const s = snap.val() || {};
    if (!s.enabled) return;
    if (s.firstBuzz) return;
    if (window._iAmMuted) return;

    hasBuzzedThisRound = true;

    db.ref('state/firstBuzz').transaction(current => {
      if (current === null) return myName;
      return;
    }).then(() => {
      db.ref('buzzes').push({ name: myName, time: Date.now() });
    });
  });
}

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinAsPlayer();
});
</script>
</body>
</html>
